<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#635BFF">
  <!-- 在线发音兜底使用第三方公开 TTS 接口；它们对带 Referer 的跨站 <audio>
       请求会返回空内容 / 404 / 500（防盗链）。去掉 Referer 后浏览器才能正常
       加载 MP3。audio.referrerPolicy 在 Chrome 上对媒体元素不生效，只能用文档级策略。 -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="SpeakBuddy - 网页版英语口语练习：兴趣定级、个性化学习路线、跟读逐词纠音，以及真实情景角色扮演对话。">
  <title>SpeakBuddy · 开口说，才真的会</title>
  <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">SB</div>
      <p>正在准备你的口语练习…</p>
    </div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="fx-root"></div>

  <script src="js/data.js?v=14"></script>
  <script src="js/speech.js?v=14"></script>
  <script src="js/recorder.js?v=14"></script>
  <script src="js/scoring.js?v=14"></script>
  <script src="js/assessment.js?v=14"></script>
  <script src="js/dialogue.js?v=14"></script>
  <script src="js/store.js?v=14"></script>
  <script src="js/route.js?v=14"></script>
  <script src="js/fx.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
